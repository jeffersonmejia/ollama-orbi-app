[agent]
  interval = "1s"
  flush_interval = "1s"
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  omit_hostname = true

[[inputs.promql]]
  url = "http://prometheus:9090"
  timeout = "5s"

  [[inputs.promql.instant]]
    name = "dash_http_requests_per_second"
    query = 'sum(rate(http_server_request_duration_seconds_count[1m]))'

  [[inputs.promql.instant]]
    name = "dash_http_latency_p95_seconds"
    query = 'histogram_quantile(0.95, sum by (le) (rate(http_server_request_duration_seconds_bucket[5m])))'

  [[inputs.promql.instant]]
    name = "dash_dotnet_thread_pool_threads"
    query = 'max(dotnet_thread_pool_thread_count_total)'

  [[inputs.promql.instant]]
    name = "dash_dotnet_thread_pool_queue"
    query = 'max(dotnet_thread_pool_queue_length_total)'

  [[inputs.promql.instant]]
    name = "dash_dotnet_process_memory_bytes"
    query = 'max(dotnet_process_memory_working_set_bytes)'

  [[inputs.promql.instant]]
    name = "dash_dotnet_cpu_seconds_per_second"
    query = 'sum(rate(dotnet_process_cpu_time_seconds_total[1m]))'

  [[inputs.promql.instant]]
    name = "dash_http_active_requests"
    query = 'sum(http_server_active_requests)'

[[outputs.websocket]]
  url = "ws://grafana:3000/api/live/push/dash-performance"
  data_format = "influx"
  connect_timeout = "10s"
  write_timeout = "10s"
  read_timeout = "60s"

  [outputs.websocket.headers]
    Authorization = "Basic ${GRAFANA_BASIC_AUTH}"

