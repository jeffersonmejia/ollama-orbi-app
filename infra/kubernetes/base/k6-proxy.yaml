apiVersion: v1
kind: ConfigMap
metadata:
  name: orbi-k6-proxy
  namespace: orbi-lab
  labels:
    app.kubernetes.io/name: orbi-k6-proxy
    app.kubernetes.io/part-of: orbi-load-test-lab
data:
  default.conf: |
    upstream orbi_backend {
      server orbi.orbi-lab.svc.cluster.local:80;
    }
    server {
      listen 8080;
      location = /healthz {
        access_log off;
        return 200 'ok';
      }
      location / {
        proxy_pass http://orbi_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orbi-k6-proxy
  namespace: orbi-lab
  labels:
    app.kubernetes.io/name: orbi-k6-proxy
    app.kubernetes.io/part-of: orbi-load-test-lab
    environment: lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: orbi-k6-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orbi-k6-proxy
        app.kubernetes.io/part-of: orbi-load-test-lab
        environment: lab
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: proxy
          image: nginxinc/nginx-unprivileged:1.29-alpine
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 96Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
      volumes:
        - name: config
          configMap:
            name: orbi-k6-proxy
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: orbi-k6-proxy
  namespace: orbi-lab
  labels:
    app.kubernetes.io/name: orbi-k6-proxy
    app.kubernetes.io/part-of: orbi-load-test-lab
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: orbi-k6-proxy
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
