apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: orbi-lab-data-protection
  namespace: orbi-lab
  labels:
    app.kubernetes.io/part-of: orbi-load-test-lab
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: orbi-lab-backups
  namespace: orbi-lab
  labels:
    app.kubernetes.io/part-of: orbi-load-test-lab
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
