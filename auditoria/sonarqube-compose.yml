services:
  sonarqube:
    image: sonarqube:community
    container_name: orbi-sonarqube-audit
    restart: "no"
    ports:
      - "127.0.0.1:9001:9000"
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs

volumes:
  sonarqube_data:
    name: orbi-sonarqube-audit-data
  sonarqube_extensions:
    name: orbi-sonarqube-audit-extensions
  sonarqube_logs:
    name: orbi-sonarqube-audit-logs
