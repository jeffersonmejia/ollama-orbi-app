services:
  prometheus:
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=5d
      - --web.enable-remote-write-receiver
    ports:
      - "127.0.0.1:19090:9090"
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - orbi-k6-lab-prometheus-data:/prometheus
    mem_limit: 512m
    cpus: 0.50
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.0.12-slim
    ports:
      - "127.0.0.1:13000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: 5s
      GF_SECURITY_COOKIE_SECURE: "false"
    volumes:
      - orbi-k6-lab-grafana-data:/var/lib/grafana
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    mem_limit: 512m
    cpus: 0.50
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_started

volumes:
  orbi-k6-lab-prometheus-data:
    name: orbi-k6-lab-prometheus-data
  orbi-k6-lab-grafana-data:
    name: orbi-k6-lab-grafana-data
